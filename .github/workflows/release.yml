name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Project-N-E-K-O/N.E.K.O
          path: .ci/N.E.K.O
          ref: main

      - uses: astral-sh/setup-uv@v5

      - name: Install N.E.K.O. dependencies
        working-directory: .ci/N.E.K.O
        run: uv sync

      - name: Install plugin-manager Node dependencies
        run: npm ci --prefix .ci/N.E.K.O/frontend/plugin-manager

      - name: Build plugin package
        run: |
          cd .ci/N.E.K.O
          uv run neko-plugin build "$GITHUB_WORKSPACE/vscode_bridge" \
            -o "$GITHUB_WORKSPACE/dist/vscode_bridge.neko-plugin"

      - uses: actions/upload-artifact@v4
        with:
          name: neko-plugin
          path: dist/vscode_bridge.neko-plugin

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vscode_bridge.neko-plugin
